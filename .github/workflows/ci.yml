name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deokhugam_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deokhugam_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test
      DATABASE_PASSWORD: postgres
      AWS_S3_ACCESS_KEY: test
      AWS_S3_SECRET_KEY: test
      AWS_S3_BUCKET: test-bucket
      OCR_API_KEY: test
      NAVER_CLIENT_ID: test
      NAVER_CLIENT_SECRET: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
