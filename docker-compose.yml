services:
  db:
    image: postgres:17
    container_name: deokhugam-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: discodeit_db
      TZ: Asia/Seoul
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discodeit_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: deokhugam:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
    container_name: deokhugam
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

